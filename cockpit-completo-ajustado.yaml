            \  \"title\": \"Cobrado no mês vs. média dos 3 meses — cada bolha é
            um CodPagador × Produto\",\r

            \"transform\": [\r

            \    { \"filter\": \"datum['Média 3M'] > 500 && datum['Cobrado'] >
            0\" },\r

            \    { \"calculate\": \"datum['Cobrado'] - datum['Média 3M']\",
            \"as\": \"delta\" },\r

            \    { \"calculate\": \"abs(datum.delta)\", \"as\": \"absDelta\"
            },\r

            \    { \"filter\": \"datum.absDelta > 1\" },\r

            \    { \"window\": [{ \"op\": \"rank\", \"as\": \"rk\" }], \"sort\":
            [{ \"field\": \"absDelta\", \"order\": \"descending\" }] },\r

            \    { \"filter\": \"datum.rk <= 40\" }\r

            \  ],\r

            \  \"layer\": [\r

            \    {\r

            \      \"mark\": { \"type\": \"line\", \"color\": \"#9aa0a6\",
            \"strokeDash\": [5,5] },\r

            \      \"encoding\": {\r

