          dataSources:
            - id: c66b0d00-f1c6-40fa-a1d8-8ea906f77ba7
              pql: "\"o_celonis_CustomerInvoiceItem\".\"DatabaseCustomerInvoiceNumber\"
                \"o_celonis_CustomerInvoiceItem\".\"DatabaseCustomerInvoiceItem\
                Number\" \"o_celonis_SalesOrderItem\".\"SystemSalesOrderNumber\"
                \"o_celonis_Customer\".\"custom_DunsNumber\"
                \"o_celonis_Customer\".\"Name\"
                \"o_celonis_Material\".\"Number\"
                \"o_celonis_Material\".\"Name\"
                \"o_celonis_CustomerInvoiceItem\".\"Currency\"
                \"o_celonis_CustomerInvoiceItem\".\"NetAmount\"
                \"o_celonis_CustomerInvoiceItem\".\"custom_BillingDate\"
                \"o_celonis_CustomerAccountDebitItem\".\"SystemAccountingDocume\
                ntNumber\"
                \"o_celonis_SalesOrderItem\".\"custom_CustomerReference\"
                \"o_celonis_SalesOrderItem\".\"custom_MetraCliente\"
                \"o_celonis_SalesOrderItem\".\"custom_MetraNumDoc\" CASE \r

                \r

                \  WHEN
                \"o_celonis_CustomerAccountDebitItem\".\"CustomerAccountTransac\
                tionType\" = 'CustomerInvoice' \r

                \r

                \      AND
                \"o_celonis_CustomerAccountDebitItem\".\"ReversalIndicator\" =
                'Reversed Document' \r

                \r

                \    THEN 'Estornado'\r

                \r

                \  WHEN PU_FIRST(  \"o_celonis_CustomerAccountDebitItem\" ,\r

                \r

                \               BIND(\"r_o_celonis_CustomerAccountClearingAssig\
                nment__CustomerAccountDebitItems\", \r

                \r

                \              PU_COUNT (
                \"o_celonis_CustomerAccountClearingAssignment\",
                BIND(\"r_o_celonis_CustomerAccountClearingAssignment__CustomerA\
                ccountCreditItems\",\r

                \r

                \                 \"o_celonis_CustomerAccountCreditItem\".\"ID\
                \")\r

                \r

                \                  ,
                \"o_celonis_CustomerAccountCreditItem\".\"CustomerAccountTransa\
                ctionType\" = 'CustomerInvoiceCancellation'\r

                \r

                \                  AND
                \"o_celonis_CustomerAccountCreditItem\".\"ReversalIndicator\" =
                'Reversal Document')\r

                \r

                \            ) ) > 0\r

                \r

                \    THEN 'Compensado com Estorno'\r

                \r

                \  ELSE 'Sem estorno'\r

                \r

                END"
